name: Build Noor Islamic Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Prepare Keystore & Environment
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        touch .env

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

    - name: Prepare APK File
      run: |
        mkdir -p output-apk
        cp app/build/outputs/apk/debug/app-debug.apk output-apk/Noor-Islamic.apk

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Noor-Islamic-APK
        path: output-apk/Noor-Islamic.apk
        retention-days: 30

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: release-v${{ github.run_number }}
        name: "Noor Islamic Android APK (v1.0.${{ github.run_number }})"
        body: |
          ### নূর ইসলামিক (Noor Islamic) APK
          - সম্পূর্ণ ৩০ পারা হাফেজী কুরআন (মুসহাফ ৬০৪ পৃষ্ঠা ভিউ)
          - ৯ জন বিশ্বখ্যাত ক্বারীর অডিও তেলওয়াত
          - সকল প্রয়োজনীয় সহীহ হাদিস ও দৈনন্দিন দোয়া
          - সঠিক কিবলা কম্পাস ও নামাজের সময়সূচি
          - Gemini AI ইসলামিক সহকারী
          - ১০০% অফলাইন ও কোনো লগইন ছাড়া ব্যবহারযোগ্য
          
          নিচের Assets থেকে **`Noor-Islamic.apk`** ফাইলে ট্যাপ করে ডাউনলোড করুন।
        files: output-apk/Noor-Islamic.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
